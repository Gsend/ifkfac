[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifkfac"
version = "0.1.0"
description = "Inverse-Free K-FAC — a numerically stable, QR-based K-FAC optimizer for PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "anon", email = "anon@anon.com" },
]
keywords = ["kfac", "k-fac", "optimizer", "natural-gradient", "pytorch", "second-order", "bf16"]
dependencies = [
  "torch>=2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "anonymous"
Repository = "https://anonymous.4open.science/anonymize/ifkfac-03C1"


[project.optional-dependencies]
test = ["pytest>=7"]
demo = ["torchvision>=0.15"]

[tool.setuptools.packages.find]
include = ["ifkfac*"]
